<!DOCTYPE html>
<html>
<head>
  <title>Orivon Client</title>
</head>
<body>

  <h2>Orivon Scanner</h2>

  <input id="input" placeholder="Enter URL or ENS" />
  <button id="searchBtn">Scan</button>

  <p id="result"></p>

  <script>
  function showMessage(msg) {
    document.getElementById("result").innerText = msg
  }

  function handleError(status) {
    if (status === 401) showMessage("Auth error")
    else if (status === 403) showMessage("Blocked by security layer")
    else if (status === 409) showMessage("Replay detected")
    else if (status === 429) showMessage("Rate limited")
    else showMessage("Error")
  }

  async function fetchScore(targetUrl) {
    const body = {
      targetUrl,
      action: "full_scan"
    }

    const res = await fetch("https://YOUR_BASE_URL/v1/scrape-score", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-zgap-key-id": "YOUR_KEY_ID",
        "x-zgap-timestamp": "YOUR_TIMESTAMP",
        "x-zgap-nonce": "YOUR_NONCE",
        "x-zgap-payload-sha256": "YOUR_BODY_HASH",
        "x-zgap-signature": "YOUR_SIGNATURE"
      },
      body: JSON.stringify(body)
    })

    if (!res.ok) {
      throw { status: res.status }
    }

    return await res.json()
  }

  function getState(score) {
    if (score >= 70) return "GREEN"
    if (score >= 40) return "AMBER"
    return "RED"
  }

  async function handleInput(input) {
    try {
      const data = await fetchScore(input)

      const state = getState(data.score)

      document.getElementById("result").innerText =
        `Score: ${data.score} | Grade: ${data.grade} | State: ${state}`
    } catch (err) {
      handleError(err.status)
    }
  }

  document.getElementById("searchBtn").onclick = async () => {
    const input = document.getElementById("input").value
    await handleInput(input)
  }
</script>

</body>
</html>
